name: Release Native Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-executables:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-13
            platform: darwin
            arch: x64
          - runner: macos-latest
            platform: darwin
            arch: arm64
          - runner: windows-latest
            platform: win32
            arch: x64
        target:
          - tpp
          - tpp2cpp
          - tpp2java
          - tpp2swift
          - render-tpp
          - tpp-lsp
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build ${{ matrix.target }}
        shell: bash
        run: cmake --build build --config Release --target ${{ matrix.target }} --parallel

      - name: Package ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "win32" ]; then
            binary_name="${{ matrix.target }}.exe"
          else
            binary_name="${{ matrix.target }}"
          fi
          mkdir -p release-artifacts
          tar -czf "release-artifacts/${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C build/bin "${binary_name}"

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.target }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-artifacts/*.tar.gz

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-executables
    runs-on: ubuntu-latest

    steps:
      - name: Collect release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*