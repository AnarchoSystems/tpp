name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-13
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install Swift
        if: runner.os == 'Linux' && matrix.os != 'ubuntu-24.04-arm'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.10'

      - name: Install Swift (Ubuntu ARM)
        if: matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          set -euo pipefail
          SWIFT_URL="https://download.swift.org/swift-6.3.3-release/ubuntu2404-aarch64/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04-aarch64.tar.gz"
          SWIFT_DIR="$RUNNER_TEMP/swift-6.3.3-ubuntu24.04-aarch64"
          curl -fsSL "$SWIFT_URL" -o "$RUNNER_TEMP/swift.tar.gz"
          mkdir -p "$SWIFT_DIR"
          tar -xzf "$RUNNER_TEMP/swift.tar.gz" -C "$SWIFT_DIR" --strip-components=1
          echo "$SWIFT_DIR/usr/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        shell: bash
        run: |
          java -version
          if command -v swift >/dev/null 2>&1; then
            swift --version
          else
            echo "swift not installed on this runner"
          fi

      - name: Configure (non-Windows)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -B build -A x64

      - name: Show CMake build context (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -LAH -N build | Select-String 'CMAKE_GENERATOR:|CMAKE_GENERATOR_PLATFORM:|CMAKE_BUILD_TYPE:|CMAKE_CONFIGURATION_TYPES:|CMAKE_CXX_COMPILER:'

      - name: Build (non-Windows)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Build (Windows, verbose with fallback)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build --config Debug --parallel --verbose
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Parallel build failed; retrying serialized with detailed MSBuild diagnostics...'
            cmake --build build --config Debug --verbose -- /m:1 /v:detailed
          }

      - name: Build Java & Swift tests (non-Windows)
        if: runner.os != 'Windows'
        run: cmake --build build --target build_all_tests --parallel

      - name: Build Java & Swift tests (Windows, verbose with fallback)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build --config Debug --target build_all_tests --parallel --verbose
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Parallel test-target build failed; retrying serialized with detailed MSBuild diagnostics...'
            cmake --build build --config Debug --target build_all_tests --verbose -- /m:1 /v:detailed
          }

      - name: Test (non-Windows)
        if: runner.os != 'Windows'
        run: ctest --parallel --progress --output-on-failure --test-dir build

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest -C Debug --parallel --progress --output-on-failure --test-dir build
