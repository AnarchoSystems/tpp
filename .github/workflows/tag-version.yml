name: Tag Version

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
    paths:
      - version.json

permissions:
  actions: write
  contents: write

jobs:
  version-changed:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.version.outputs.changed }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check version change
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if git diff-tree --no-commit-id --name-only -r --root HEAD -- version.json | grep -qx 'version.json'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  tag:
    needs: version-changed
    if: needs.version-changed.outputs.changed == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          major=$(jq -er '.major | select(type == "number" and floor == . and . >= 0)' version.json)
          minor=$(jq -er '.minor | select(type == "number" and floor == . and . >= 0)' version.json)
          patch=$(jq -er '.patch | select(type == "number" and floor == . and . >= 0)' version.json)
          tag="v${major}.${minor}.${patch}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          commit_sha=$(git rev-parse HEAD)
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            if [ "$(git rev-list -n 1 "$TAG")" != "$commit_sha" ]; then
              echo "Tag $TAG already points to a different commit" >&2
              exit 1
            fi
          else
            git tag "$TAG" "$commit_sha"
            git push origin "$TAG"
          fi

      - name: Start release workflows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref "$TAG"
          gh workflow run release-extension.yml --ref "$TAG"
